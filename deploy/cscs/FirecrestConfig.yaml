# Bridge configuration for CSCS. The client secret is not here: it comes from
# the firecrest-client Secret as FIRECREST_CLIENT_SECRET (see kustomization.yaml).
FirecrestURL: https://api.cscs.ch/hpc/firecrest/v2
System: <system, e.g. daint>
TokenURL: https://auth.cscs.ch/auth/realms/firecrest-clients/protocol/openid-connect/token
ClientID: <client id from the CSCS Developer Portal>
# Passed to every job as --account.
Account: <project>
# The plugin's DataRootFolder: same absolute path in the pod and on Alps.
JobRoot: /capstor/scratch/cscs/<user>/interlink/jobs
