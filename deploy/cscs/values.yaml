# interlink-helm-chart values (0.6.2-pre5 or later) for a virtual node that
# offloads to CSCS (Alps) through FirecREST: virtual kubelet, interLink API and
# the official slurm plugin in one pod, plus the bridge as an extra container.
# Fill in every <...> before installing. The job root path must be the same in
# all four places it appears.
nodeName: cscs-firecrest

interlink:
  enabled: true
  image: ghcr.io/interlink-hq/interlink/interlink:0.6.3-pre2
  address: http://localhost
  port: 3000

virtualNode:
  image: ghcr.io/interlink-hq/interlink/virtual-kubelet-inttw:0.6.3-pre2
  # Zero CPU and memory, see ResourceScriptPath below.
  resources:
    CPUs: 0
    memGiB: 0
    pods: 100

plugin:
  enabled: true
  image: ghcr.io/interlink-hq/interlink-sidecar-slurm/interlink-sidecar-slurm:0.6.3-pre2
  # The image's default entrypoint also starts a local Slurm; run the plugin only.
  command: ["/sidecar/slurm-sidecar"]
  address: http://localhost
  port: 4000
  envs:
    - name: SLURMCONFIGPATH
      value: /etc/interlink/plugin.yaml
    - name: SHARED_FS
      value: "true"
  extraVolumeMounts:
    - name: jobs
      mountPath: /capstor/scratch/cscs/<user>/interlink/jobs
    - name: bridge-socket
      mountPath: /var/run/firecrest-bridge
    - name: bridge-shims
      mountPath: /opt/firecrest-bridge
      readOnly: true
  config: |
    SidecarPort: "4000"
    Socket: ""
    # The Slurm commands are the bridge shims, installed by the init container.
    SbatchPath: /opt/firecrest-bridge/sbatch
    ScancelPath: /opt/firecrest-bridge/scancel
    SqueuePath: /opt/firecrest-bridge/squeue
    SinfoPath: /opt/firecrest-bridge/sinfo
    # Mirrored to the same path on Alps by the bridge (its job root).
    DataRootFolder: /capstor/scratch/cscs/<user>/interlink/jobs/
    ExportPodData: true
    Namespace: vk
    BashPath: /bin/bash
    # The virtual node advertises what this prints. The bridge's sinfo reports
    # the whole machine (45824 CPUs on Eiger), and a cluster-proportional
    # CoreDNS autoscaler adds a replica per 256 advertised cores. With zero, a
    # pod fits only with CPU and memory requests at 0; the plugin sizes the
    # Slurm job from limits (sizing-policy.yaml sets both).
    ResourceScriptPath: "echo '{\"status\":\"ok\",\"resources\":{\"cpu\":\"0\",\"memory\":\"0\",\"pods\":\"100\"}}'"
    # Alps runs the enroot-based Container Engine, not Apptainer.
    ContainerRuntime: enroot
    EnrootPath: enroot
    EnrootDefaultOptions: ["--rw"]
    ImagePrefix: "docker://"
    EnableProbes: true
    DefaultFlavor: default
    Flavors:
      default:
        Name: default
        Description: CPU job on Alps
        CPUDefault: 8
        MemoryDefault: 32G
        SlurmFlags:
          - --partition=<partition>

extraInitContainers:
  - name: install-shims
    image: registry.cern.ch/interlink/firecrest-bridge:0.1.0
    args: ["install-shims", "/opt/firecrest-bridge"]
    volumeMounts:
      - name: bridge-shims
        mountPath: /opt/firecrest-bridge

# The bridge takes its configuration from the environment ("--config ''"):
# FIRECREST_URL, _TOKEN_URL, _SYSTEM, _ACCOUNT, _CLIENT_ID and _CLIENT_SECRET
# come from the firecrest-env Secret, created beforehand (README).
extraContainers:
  - name: firecrest-bridge
    image: registry.cern.ch/interlink/firecrest-bridge:0.1.0
    args: ["daemon", "--config", ""]
    envFrom:
      - secretRef:
          name: firecrest-env
    env:
      # Must match DataRootFolder; the render check compares them.
      - name: FIRECREST_JOB_ROOT
        value: /capstor/scratch/cscs/<user>/interlink/jobs
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    volumeMounts:
      - name: jobs
        mountPath: /capstor/scratch/cscs/<user>/interlink/jobs
      - name: bridge-socket
        mountPath: /var/run/firecrest-bridge

extraVolumes:
  - name: jobs
    emptyDir: {}
  - name: bridge-socket
    emptyDir: {}
  - name: bridge-shims
    emptyDir: {}
