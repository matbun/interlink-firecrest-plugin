apiVersion: v1
kind: ConfigMap
metadata:
  name: firecrest-demo
data:
  greeting: hello-from-a-kubernetes-configmap
---
apiVersion: v1
kind: Pod
metadata:
  name: firecrest-hello
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: firecrest-node
  tolerations:
    - key: virtual-node.interlink/no-schedule
      operator: Exists
  containers:
    - name: main
      image: alpine:3.20
      command: ["sh", "-c"]
      args:
        - |
          echo "hello from $(hostname), alpine $(cat /etc/alpine-release)"
          echo "configmap: $(cat /etc/demo/greeting)"
          for i in 1 2 3 4 5; do echo "tick $i"; sleep 2; done
          echo "finished"
      volumeMounts:
        - name: demo
          mountPath: /etc/demo
  volumes:
    - name: demo
      configMap:
        name: firecrest-demo
