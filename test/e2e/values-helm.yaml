# With a chart that has extraContainers and extraInitContainers
# (interlink-helm-chart feat/extra-containers), the bridge goes into values and
# the whole virtual node installs with helm install, no kustomize. Used on top
# of values.yaml by "INSTALL=helm run.sh".
#
# The bridge reads its configuration from the environment ("--config ''"), so no
# ConfigMap is needed; only the firecrest-client Secret exists beforehand.
extraInitContainers:
  - name: install-shims
    image: firecrest-bridge:dev
    imagePullPolicy: Never
    args: ["install-shims", "/opt/firecrest-bridge"]
    volumeMounts:
      - name: bridge-shims
        mountPath: /opt/firecrest-bridge

extraContainers:
  - name: firecrest-bridge
    image: firecrest-bridge:dev
    imagePullPolicy: Never
    args: ["daemon", "--config", ""]
    env:
      - name: FIRECREST_URL
        value: http://192.168.240.10:5000
      - name: FIRECREST_SYSTEM
        value: cluster-slurm-ssh
      - name: FIRECREST_TOKEN_URL
        value: http://192.168.240.3:8080/auth/realms/kcrealm/protocol/openid-connect/token
      - name: FIRECREST_CLIENT_ID
        value: firecrest-test-client
      - name: FIRECREST_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: firecrest-client
            key: client-secret
      - name: FIRECREST_JOB_ROOT
        value: /home/fireuser/interlink/jobs
    volumeMounts:
      - name: jobs
        mountPath: /home/fireuser/interlink/jobs
      - name: bridge-socket
        mountPath: /var/run/firecrest-bridge
