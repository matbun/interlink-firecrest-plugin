# The chart rendered by run.sh (rendered.yaml), plus the bridge: an init
# container that installs the shims for the plugin, and the daemon itself.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: interlink

resources:
  - rendered.yaml

configMapGenerator:
  - name: firecrest-bridge-config
    files:
      - FirecrestConfig.yaml

secretGenerator:
  - name: firecrest-client
    literals:
      # FirecREST demo stack secret of firecrest-test-client (firecrest-v2 docker-compose.yml).
      - client-secret=wZVHVIEd9dkJDh9hMKc6DTvkqXxnDttk

patches:
  - target:
      kind: Deployment
      name: firecrest-node-node
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: firecrest-node-node
      spec:
        template:
          spec:
            initContainers:
              - name: install-shims
                image: firecrest-bridge:dev
                imagePullPolicy: Never
                args: ["install-shims", "/opt/firecrest-bridge"]
                volumeMounts:
                  - name: bridge-shims
                    mountPath: /opt/firecrest-bridge
            containers:
              - name: firecrest-bridge
                image: firecrest-bridge:dev
                imagePullPolicy: Never
                args: ["daemon", "--config", "/etc/interlink/FirecrestConfig.yaml"]
                env:
                  - name: FIRECREST_CLIENT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: firecrest-client
                        key: client-secret
                volumeMounts:
                  - name: jobs
                    mountPath: /home/fireuser/interlink/jobs
                  - name: bridge-socket
                    mountPath: /var/run/firecrest-bridge
                  - name: bridge-config
                    mountPath: /etc/interlink/FirecrestConfig.yaml
                    subPath: FirecrestConfig.yaml
              - name: plugin
                imagePullPolicy: IfNotPresent
              - name: interlink
                imagePullPolicy: IfNotPresent
              - name: vk
                imagePullPolicy: IfNotPresent
            volumes:
              - name: bridge-config
                configMap:
                  name: firecrest-bridge-config
