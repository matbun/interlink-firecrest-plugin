# Bridge configuration for FirecREST's local demo stack (firecrest-v2
# docker-compose.yml). run.sh writes the client secret file from the demo stack's
# Keycloak configuration, so no secret value is kept in this repository.
FirecrestURL: http://192.168.240.10:5000
System: cluster-slurm-ssh
TokenURL: http://192.168.240.3:8080/auth/realms/kcrealm/protocol/openid-connect/token
ClientID: firecrest-test-client
ClientSecretFile: /etc/interlink/client-secret
JobRoot: /home/fireuser/interlink/jobs
Socket: /var/run/firecrest-bridge/bridge.sock
SyncInterval: 2s
# run.sh derives how long a gang's head may stay on the cluster from these two.
FinalSyncRounds: 2
