version: "2"

linters:
  enable:
    - gocritic
    - misspell
    - unconvert
  settings:
    errcheck:
      # Writes to stdout, stderr and HTTP responses, and closing a response
      # body: nothing useful to do with these errors.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - io.WriteString
        - (*encoding/json.Encoder).Encode
        - (io.ReadCloser).Close
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
